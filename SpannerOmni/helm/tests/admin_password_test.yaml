suite: Spanner Admin Password Tests
templates:
  - create-deployment.yaml
  - spanner_statefulset.yaml
  - spanner-config.yaml
  - validations.yaml

tests:
  - it: should fail validation when insecureMode is false and deployment.adminPasswordSecret is omitted on install
    set:
      global:
        insecureMode: false
    asserts:
      - failedTemplate:
          errorPattern: ".*An admin password secret is required when creating a deployment in secure mode.*"
        template: validations.yaml

  - it: should directly mount custom secret with defaultMode 384 and pass --admin-password-file=/tmp/.admin-password when deployment.adminPasswordSecret is provided
    set:
      deployment:
        adminPasswordSecret: "my-custom-admin-secret"
    asserts:
      - hasDocuments:
          count: 1
        template: create-deployment.yaml
      - isNull:
          path: spec.template.spec.initContainers
        template: create-deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "if ! touch /tmp/\\.admin-password \\|\\| ! chmod 600 /tmp/\\.admin-password \\|\\| ! cat /etc/admin-password/password > /tmp/\\.admin-password; then"
        template: create-deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "--admin-password-file=/tmp/\\.admin-password"
        template: create-deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "rm -f /tmp/\\.admin-password"
        template: create-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: admin-password
            mountPath: /etc/admin-password
            readOnly: true
        template: create-deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: admin-password
            secret:
              secretName: my-custom-admin-secret
              defaultMode: 384
              items:
                - key: password
                  path: password
        template: create-deployment.yaml

  - it: should not mount admin password secret in multi-server spanner_statefulset even when adminPasswordSecret is provided
    set:
      deployment:
        singleServer: false
        adminPasswordSecret: "my-custom-admin-secret"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: admin-password
        template: spanner_statefulset.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: admin-password
        template: spanner_statefulset.yaml

  - it: should directly mount admin password secret in statefulset and pass --admin-password-file in postStart for secure singleServer
    set:
      deployment:
        singleServer: true
        adminPasswordSecret: "my-custom-single-server-secret"
      global:
        insecureMode: false
    asserts:
      - hasDocuments:
          count: 0
        template: create-deployment.yaml
      - isNull:
          path: spec.template.spec.initContainers
        template: spanner_statefulset.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: admin-password
            secret:
              secretName: my-custom-single-server-secret
              defaultMode: 384
              items:
                - key: password
                  path: password
        template: spanner_statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: admin-password
            mountPath: /etc/admin-password
            readOnly: true
        template: spanner_statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: deployment-config
            mountPath: /etc/spanner-config
        template: spanner_statefulset.yaml
      # The postStart creates an empty 0600 file on the ephemeral /tmp emptyDir
      # volume (the pod's fsGroup makes the Secret mount 0640, which deployment
      # create rejects), copies the Secret into it, passes it to
      # --admin-password-file, and removes it on both failure and success paths.
      - matchRegex:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command[2]
          pattern: "if ! touch /tmp/\\.admin-password \\|\\| ! chmod 600 /tmp/\\.admin-password \\|\\| ! cat /etc/admin-password/password > /tmp/\\.admin-password; then"
        template: spanner_statefulset.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command[2]
          pattern: "--admin-password-file=/tmp/\\.admin-password"
        template: spanner_statefulset.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command[2]
          pattern: "rm -f /tmp/\\.admin-password"
        template: spanner_statefulset.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command[2]
          pattern: "/spanner/\\.admin-password"
        template: spanner_statefulset.yaml

  - it: should configure non-root securityContext with fsGroup 2000, disable service account token automount, and mount /tmp emptyDir in create-deployment job
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: create-deployment.yaml
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
        template: create-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
        template: create-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp-volume
            mountPath: /tmp
        template: create-deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp-volume
            emptyDir: {}
        template: create-deployment.yaml

  - it: should fail validation for secure singleServer when adminPasswordSecret is omitted on install
    set:
      deployment:
        singleServer: true
      global:
        insecureMode: false
    asserts:
      - failedTemplate:
          errorPattern: ".*An admin password secret is required when creating a deployment.*"
        template: validations.yaml

  - it: should fail validation for mTLS-only secure deployment when deployment.adminPasswordSecret is omitted on install
    set:
      global:
        insecureMode: false
      deployment:
        enableClientCertificateAuthentication: true
        enablePasswordAuthentication: false
    asserts:
      - failedTemplate:
          errorPattern: ".*An admin password secret is required when creating a deployment in secure mode.*"
        template: validations.yaml

  - it: should pass validation and omit admin password secret when insecureMode is true and singleServer is false
    set:
      global:
        insecureMode: true
      deployment:
        singleServer: false
    asserts:
      - hasDocuments:
          count: 0
        template: validations.yaml
      - hasDocuments:
          count: 1
        template: create-deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--admin-password-file=/etc/admin-password/password"
        template: create-deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: admin-password
        template: create-deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: admin-password
        template: create-deployment.yaml

  - it: should pass validation and omit admin password secret when insecureMode is true and singleServer is true
    set:
      global:
        insecureMode: true
      deployment:
        singleServer: true
    asserts:
      - hasDocuments:
          count: 0
        template: validations.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: admin-password
        template: spanner_statefulset.yaml
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: admin-password
        template: spanner_statefulset.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command[2]
          pattern: "--admin-password-file"
        template: spanner_statefulset.yaml

  - it: should mount admin password secret and pass --admin-password-file in postStart for insecure singleServer when provided
    set:
      deployment:
        singleServer: true
        adminPasswordSecret: "my-insecure-single-server-secret"
      global:
        insecureMode: true
    asserts:
      - hasDocuments:
          count: 0
        template: create-deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: admin-password
            secret:
              secretName: my-insecure-single-server-secret
              defaultMode: 384
              items:
                - key: password
                  path: password
        template: spanner_statefulset.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command[2]
          pattern: "--admin-password-file=/spanner/.admin-password"
        template: spanner_statefulset.yaml
