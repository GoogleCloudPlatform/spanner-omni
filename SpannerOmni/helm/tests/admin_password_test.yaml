suite: Spanner Admin Password Tests
templates:
  - create-deployment.yaml
  - spanner_statefulset.yaml
  - spanner-config.yaml

tests:
  - it: should not mount the admin password secret or pass --admin-password-file by default
    asserts:
      - hasDocuments:
          count: 1
        template: create-deployment.yaml
      - isNull:
          path: spec.template.spec.initContainers
        template: create-deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--admin-password-file=/etc/admin-password/password"
        template: create-deployment.yaml

  - it: should directly mount custom secret with defaultMode 384 and pass --admin-password-file when deployment.adminPasswordSecret is provided
    set:
      deployment:
        adminPasswordSecret: "my-custom-admin-secret"
    asserts:
      - hasDocuments:
          count: 1
        template: create-deployment.yaml
      - isNull:
          path: spec.template.spec.initContainers
        template: create-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--admin-password-file=/etc/admin-password/password"
        template: create-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: admin-password
            mountPath: /etc/admin-password
            readOnly: true
        template: create-deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: admin-password
            secret:
              secretName: my-custom-admin-secret
              defaultMode: 384
              items:
                - key: password
                  path: password
        template: create-deployment.yaml

  - it: should not mount admin password secret in spanner_statefulset by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: admin-password
        template: spanner_statefulset.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: admin-password
        template: spanner_statefulset.yaml

  - it: should directly mount admin password secret in statefulset and pass --admin-password-file in postStart for secure singleServer
    set:
      deployment:
        singleServer: true
        adminPasswordSecret: "my-custom-single-server-secret"
      global:
        insecureMode: false
    asserts:
      - hasDocuments:
          count: 0
        template: create-deployment.yaml
      - isNull:
          path: spec.template.spec.initContainers
        template: spanner_statefulset.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: admin-password
            secret:
              secretName: my-custom-single-server-secret
              defaultMode: 384
              items:
                - key: password
                  path: password
        template: spanner_statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: admin-password
            mountPath: /etc/admin-password
            readOnly: true
        template: spanner_statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: deployment-config
            mountPath: /etc/spanner-config
        template: spanner_statefulset.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command[2]
          pattern: "--admin-password-file=/etc/admin-password/password"
        template: spanner_statefulset.yaml

  - it: should not mount admin password secret or pass --admin-password-file for secure singleServer when adminPasswordSecret is omitted
    set:
      deployment:
        singleServer: true
      global:
        insecureMode: false
    asserts:
      - hasDocuments:
          count: 0
        template: create-deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: admin-password
        template: spanner_statefulset.yaml
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: admin-password
        template: spanner_statefulset.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command[2]
          pattern: "--admin-password-file"
        template: spanner_statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: deployment-config
            mountPath: /etc/spanner-config
        template: spanner_statefulset.yaml
