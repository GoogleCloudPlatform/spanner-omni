suite: Bundled Jaeger TLS Validation Tests
templates:
  - validations.yaml

# lookup only sees objects in a live cluster, so these tests use a fake one.
tests:
  - it: should fail if the Jaeger TLS Secret is missing
    set: &tlsOn
      monitoring:
        enabled: true
        jaeger:
          tls:
            enabled: true
    kubernetesProvider:
      scheme: &scheme
        "v1/Namespace":
          gvr: {version: "v1", resource: "namespaces"}
          namespaced: false
        "v1/Secret":
          gvr: {version: "v1", resource: "secrets"}
          namespaced: true
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: monitoring}
    asserts:
      - failedTemplate:
          errorPattern: "Secret 'jaeger-tls' doesn't exist in the 'monitoring' namespace"

  - it: should fail if the Jaeger TLS Secret has no tls.key
    set: *tlsOn
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: monitoring}
        - kind: Secret
          apiVersion: v1
          metadata: {name: jaeger-tls, namespace: monitoring}
          data: {tls.crt: Y2VydA==}
    asserts:
      - failedTemplate:
          errorPattern: "has no \\(or an empty\\) 'tls.key' key"

  - it: should check a custom Secret name in a custom namespace
    set:
      monitoring:
        enabled: true
        namespace: obs
        jaeger:
          tls:
            enabled: true
            secretName: my-jaeger-cert
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: obs}
    asserts:
      - failedTemplate:
          errorPattern: "Secret 'my-jaeger-cert' doesn't exist in the 'obs' namespace"

  - it: should pass if the Jaeger TLS Secret has both keys
    set: *tlsOn
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: monitoring}
        - kind: Secret
          apiVersion: v1
          metadata: {name: jaeger-tls, namespace: monitoring}
          data: {tls.crt: Y2VydA==, tls.key: a2V5}
    asserts:
      - notFailedTemplate: {}

  - it: should skip the check without a cluster (helm template)
    set: *tlsOn
    asserts:
      - notFailedTemplate: {}

  - it: should not check the Secret when Jaeger TLS is disabled
    set:
      monitoring:
        enabled: true
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: monitoring}
    asserts:
      - notFailedTemplate: {}

  - it: should fail a secure-mode install with the bundled Jaeger but no TLS
    set:
      global:
        insecureMode: false
      deployment:
        adminPasswordSecret: spanner-admin-password
      monitoring:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "requires TLS on Jaeger's OTLP gRPC receiver"

  - it: should not block upgrading an existing secure-mode release without Jaeger TLS
    release:
      upgrade: true
    set:
      global:
        insecureMode: false
      monitoring:
        enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: should allow a secure-mode install that exports to a custom collector
    set:
      global:
        insecureMode: false
      deployment:
        adminPasswordSecret: spanner-admin-password
        traceExporterEndpoint: "dns:///otel-collector.example.com:4317"
      monitoring:
        enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: should allow a secure-mode install with Jaeger TLS enabled
    set:
      global:
        insecureMode: false
      deployment:
        adminPasswordSecret: spanner-admin-password
      monitoring:
        enabled: true
        jaeger:
          tls:
            enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: should allow an insecure-mode install without Jaeger TLS
    set:
      global:
        insecureMode: true
      monitoring:
        enabled: true
    asserts:
      - notFailedTemplate: {}
