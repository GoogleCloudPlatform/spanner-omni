suite: Storage Class Tests
templates:
  - storage.yaml

tests:
  - it: should not render storage classes by default
    asserts:
      - hasDocuments:
          count: 0
        template: storage.yaml

  - it: should render storage classes for eks platform
    set:
      global:
        platform: eks
    asserts:
      - hasDocuments:
          count: 2
        template: storage.yaml

  - it: should render storage classes for aks platform
    set:
      global:
        platform: aks
    asserts:
      - hasDocuments:
          count: 2
        template: storage.yaml

  - it: should render storage classes for vsphere platform
    set:
      global:
        platform: vsphere
    asserts:
      - hasDocuments:
          count: 1
        template: storage.yaml

  - it: should not render storage classes when overridden to false (eks)
    set:
      global:
        platform: eks
      createStorageClasses: false
    asserts:
      - hasDocuments:
          count: 0
        template: storage.yaml

  - it: should not render storage classes when overridden to false (aks)
    set:
      global:
        platform: aks
      createStorageClasses: false
    asserts:
      - hasDocuments:
          count: 0
        template: storage.yaml

  - it: should not render storage classes for gke platform by default
    set:
      global:
        platform: gke
    asserts:
      - hasDocuments:
          count: 0
        template: storage.yaml
