suite: Spanner License Key Secret Tests
templates:
  - spanner-license-key.yaml

tests:
  - it: should not render the license key secret by default
    asserts:
      - hasDocuments:
          count: 0
        template: spanner-license-key.yaml

  - it: should render the license key secret when licenseKey is provided
    set:
      licenseKey: "my-super-secret-license-key-content"
    asserts:
      - hasDocuments:
          count: 1
        template: spanner-license-key.yaml
      - equal:
          path: metadata.name
          value: spanner-license-key
        template: spanner-license-key.yaml
      - equal:
          path: kind
          value: Secret
        template: spanner-license-key.yaml
      - equal:
          path: type
          value: Opaque
        template: spanner-license-key.yaml
      - equal:
          path: stringData.LICENSE_KEY
          value: "my-super-secret-license-key-content"
        template: spanner-license-key.yaml

  - it: should support custom namespace override for the license key secret
    set:
      licenseKey: "my-super-secret-license-key-content"
      namespaceOverride: "custom-namespace"
    asserts:
      - equal:
          path: metadata.namespace
          value: "custom-namespace"
        template: spanner-license-key.yaml
