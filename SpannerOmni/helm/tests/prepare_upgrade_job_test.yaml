suite: Spanner Prepare Upgrade Job Tests
templates:
  - prepare-upgrade-job.yaml

tests:
  - it: should render the job by default with dedicated root server
    asserts:
      - equal:
          path: kind
          value: Job
        template: prepare-upgrade-job.yaml
      - equal:
          path: metadata.name
          value: spanner-prepare-for-upgrade
        template: prepare-upgrade-job.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--root_server=spanner-a-rt-0.pod.NAMESPACE"
        template: prepare-upgrade-job.yaml


  - it: should not render the job when skipPrepareUpgrade is true
    set:
      skipPrepareUpgrade: true
    asserts:
      - hasDocuments:
          count: 0
        template: prepare-upgrade-job.yaml

  - it: should not render the job when deployment.singleServer is true
    set:
      deployment:
        singleServer: true
    asserts:
      - hasDocuments:
          count: 0
        template: prepare-upgrade-job.yaml

  - it: should configure nodeSelector, tolerations, and resource limits
    set:
      nodeSelector:
        disktype: ssd
      tolerations:
        - key: "database"
          operator: "Equal"
          value: "spanner"
          effect: "NoSchedule"
      jobs:
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
        template: prepare-upgrade-job.yaml
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: database
        template: prepare-upgrade-job.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
        template: prepare-upgrade-job.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 200m
        template: prepare-upgrade-job.yaml
