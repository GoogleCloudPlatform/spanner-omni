suite: Jaeger OTLP TLS Warning Tests
templates:
  - NOTES.txt

tests:
  - it: should list the TLS requirements in secure mode, where Jaeger TLS is on by default
    release:
      name: my-release
      namespace: spanner-ns
    set:
      global:
        insecureMode: false
      deployment:
        adminPasswordSecret: spanner-admin-password
      monitoring:
        enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "\\[NOTE\\] The bundled Jaeger only accepts traces over TLS"
      - matchRegexRaw:
          pattern: "contains `ca-otlp\\.crt`"
      - matchRegexRaw:
          pattern: "release 2026\\.r6 or later"
      - matchRegexRaw:
          pattern: "kubectl rollout restart statefulset -n spanner-ns -l app\\.kubernetes\\.io/instance=my-release"

  - it: should list the TLS requirements when Jaeger TLS is enabled in insecure mode
    set:
      global:
        insecureMode: true
      monitoring:
        enabled: true
        jaeger:
          tls:
            enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "\\[NOTE\\] The bundled Jaeger only accepts traces over TLS"

  - it: should not list the TLS requirements in insecure mode by default
    set:
      global:
        insecureMode: true
      monitoring:
        enabled: true
    asserts:
      - notMatchRegexRaw:
          pattern: "\\[NOTE\\]"

  - it: should not list the TLS requirements when monitoring is disabled
    set:
      global:
        insecureMode: false
      deployment:
        adminPasswordSecret: spanner-admin-password
    asserts:
      - notMatchRegexRaw:
          pattern: "\\[NOTE\\]"
