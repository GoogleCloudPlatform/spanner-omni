suite: Jaeger OTLP TLS Warning Tests
templates:
  - NOTES.txt

tests:
  - it: should warn in secure mode when the bundled Jaeger does not serve TLS
    release:
      namespace: spanner-ns
    set:
      global:
        insecureMode: false
      deployment:
        adminPasswordSecret: spanner-admin-password
      monitoring:
        enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "\\[WARNING\\] Traces will NOT be exported in secure mode!"
      - matchRegexRaw:
          pattern: "monitoring\\.jaeger\\.tls\\.enabled=true"
      - matchRegexRaw:
          pattern: "jaeger\\.monitoring\\.svc\\.cluster\\.local"
      - matchRegexRaw:
          pattern: "`tls-certs` Secret in the\\s+\"spanner-ns\" namespace under the key `ca-otlp\\.crt`"

  - it: should use the custom monitoring namespace and secret name in the warning
    set:
      global:
        insecureMode: false
      deployment:
        adminPasswordSecret: spanner-admin-password
      monitoring:
        enabled: true
        namespace: obs
        jaeger:
          tls:
            secretName: my-jaeger-cert
    asserts:
      - matchRegexRaw:
          pattern: "\"my-jaeger-cert\""
      - matchRegexRaw:
          pattern: "jaeger\\.obs\\.svc\\.cluster\\.local"

  - it: should not warn when Jaeger TLS is enabled
    set:
      global:
        insecureMode: false
      deployment:
        adminPasswordSecret: spanner-admin-password
      monitoring:
        enabled: true
        jaeger:
          tls:
            enabled: true
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING"

  - it: should not warn in insecure mode
    set:
      global:
        insecureMode: true
      monitoring:
        enabled: true
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING"

  - it: should not warn when monitoring is disabled
    set:
      global:
        insecureMode: false
      deployment:
        adminPasswordSecret: spanner-admin-password
      monitoring:
        enabled: false
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING"

  - it: should not warn when a custom trace exporter endpoint is set
    set:
      global:
        insecureMode: false
      deployment:
        adminPasswordSecret: spanner-admin-password
        traceExporterEndpoint: "dns:///otel-collector.example.com:4317"
      monitoring:
        enabled: true
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING"
