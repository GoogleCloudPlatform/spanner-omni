suite: Service Tests
templates:
  - services.yaml

tests:
  - it: should include externalTrafficPolicy Local when service type is LoadBalancer
    set:
      service:
        type: LoadBalancer
    asserts:
      - equal:
          path: spec.externalTrafficPolicy
          value: Local
        documentIndex: 0
        template: services.yaml

  - it: should include externalTrafficPolicy Local when service type is NodePort
    set:
      service:
        type: NodePort
    asserts:
      - equal:
          path: spec.externalTrafficPolicy
          value: Local
        documentIndex: 0
        template: services.yaml

  - it: should NOT include externalTrafficPolicy when service type is ClusterIP
    set:
      service:
        type: ClusterIP
    asserts:
      - isNull:
          path: spec.externalTrafficPolicy
        documentIndex: 0
        template: services.yaml
