suite: Pod Disruption Budget Tests
templates:
  - pod_disruption_budget.yaml

tests:
  - it: should set maxUnavailable to default value of 1 when not specified
    set:
      deployment:
        replicasPerZone: 40
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
        template: pod_disruption_budget.yaml

  - it: should set maxUnavailable to configured override value from values.yaml
    set:
      deployment:
        pdbMaxUnavailable: 3
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 3
        template: pod_disruption_budget.yaml

  - it: should not render PDB when singleServer is true
    set:
      deployment:
        singleServer: true
    asserts:
      - hasDocuments:
          count: 0
        template: pod_disruption_budget.yaml

  - it: should render worker PDB with default maxUnavailable of 1 when workers are enabled
    set:
      currentLocation: us
      workers:
        enabled: true
    asserts:
      - hasDocuments:
          count: 2
        template: pod_disruption_budget.yaml
      - equal:
          path: metadata.name
          value: spanner-worker-budget
        documentIndex: 1
        template: pod_disruption_budget.yaml
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: spanner-worker
        documentIndex: 1
        template: pod_disruption_budget.yaml
      - equal:
          path: spec.maxUnavailable
          value: 1
        documentIndex: 1
        template: pod_disruption_budget.yaml

  - it: should configure custom worker pdbMaxUnavailable
    set:
      currentLocation: us
      workers:
        enabled: true
        pdbMaxUnavailable: 2
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 2
        documentIndex: 1
        template: pod_disruption_budget.yaml
