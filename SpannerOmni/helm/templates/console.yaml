{{- if eq (include "spanner-omni.consoleEnabled" $) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ include "spanner-omni.namespace" $ }}
  name: spanner-omni-console
  labels:
    app.kubernetes.io/component: console
    {{- include "spanner-omni.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: console
      {{- include "spanner-omni.selectorLabels" $ | nindent 6 }}
  replicas: {{ include "spanner-omni.uiReplicas" $ }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: console
        {{- include "spanner-omni.labels" $ | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if $.Values.image.pullSecret }}
      imagePullSecrets:
      - name: {{ $.Values.image.pullSecret }}
      {{- end }}
      {{- if $.Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml $.Values.console.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $.Values.console.tolerations }}
      tolerations:
        {{- toYaml $.Values.console.tolerations | nindent 8 }}
      {{- end }}
      {{- if $.Values.console.affinity }}
      affinity:
        {{- toYaml $.Values.console.affinity | nindent 8 }}
      {{- end }}
      {{- if $.Values.securityContext }}
      securityContext:
        {{- toYaml $.Values.securityContext.pod | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: console
              {{- include "spanner-omni.selectorLabels" $ | nindent 14 }}
      containers:
      - name: spanner-omni-console
        image: {{ include "spanner-omni.uiImage" $ | quote }}
        env:
        - name: SPANNER_HOST
          value: "spanner"
        - name: SPANNER_PORT
          value: {{ $.Values.deployment.basePort | default 15000 | quote }}
        imagePullPolicy: {{ $.Values.console.image.pullPolicy | default "IfNotPresent" }}
        {{- if $.Values.console.resources }}
        resources:
          {{- toYaml $.Values.console.resources | nindent 10 }}
        {{- end }}
        readinessProbe:
          tcpSocket:
            port: {{ include "spanner-omni.consolePort" $ }}
          initialDelaySeconds: 5
          periodSeconds: 10
        ports:
        - containerPort: {{ include "spanner-omni.consolePort" $ }}
---
apiVersion: v1
kind: Service
metadata:
  name: spanner-omni-console
  namespace: {{ include "spanner-omni.namespace" $ }}
  labels:
    app.kubernetes.io/component: console
    {{- include "spanner-omni.labels" $ | nindent 4 }}
  {{- $platformValues := include "spanner-omni.PlatformValues" $ | fromYaml }}
  {{- if $platformValues.serviceAnnotations }}
  annotations:
    {{- toYaml $platformValues.serviceAnnotations | nindent 4 }}
  {{- end }}
spec:
  {{- $serviceType := $.Values.console.service.type }}
  {{- if not $serviceType }}
    {{- $replicas := include "spanner-omni.uiReplicas" $ | int }}
    {{- if gt $replicas 1 }}
      {{- $serviceType = "LoadBalancer" }}
    {{- else }}
      {{- $serviceType = "NodePort" }}
    {{- end }}
  {{- end }}
  type: {{ $serviceType }}
  ports:
  - port: {{ $.Values.console.service.port | default (include "spanner-omni.consolePort" $) }}
    protocol: TCP
    targetPort: {{ include "spanner-omni.consolePort" $ }}
    {{- if eq $serviceType "NodePort" }}
    nodePort: {{ $.Values.console.service.nodePort | default 30026 }}
    {{- end }}
  selector:
    app.kubernetes.io/component: console
    {{- include "spanner-omni.selectorLabels" $ | nindent 4 }}
{{- end }}
