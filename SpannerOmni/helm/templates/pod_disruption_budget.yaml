{{- if not .Values.deployment.singleServer }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spanner-budget
  namespace: {{ include "spanner-omni.namespace" $ }}
  labels:
    {{- include "spanner-omni.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "spanner-omni.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: spanner
  maxUnavailable: {{ .Values.deployment.pdbMaxUnavailable | default 1 }}
{{- if .Values.workers.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spanner-worker-budget
  namespace: {{ include "spanner-omni.namespace" $ }}
  labels:
    {{- include "spanner-omni.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "spanner-omni.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: spanner-worker
  maxUnavailable: {{ .Values.workers.pdbMaxUnavailable | default 1 }}
{{- end }}
{{- end }}
