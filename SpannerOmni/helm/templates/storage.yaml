{{- $platformValues := include "spanner-omni.PlatformValues" . | fromYaml -}}
{{- if ne $platformValues.createStorageClasses false }}
{{- range $platformValues.storageClasses }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
provisioner: {{ .provisioner }}
volumeBindingMode: {{ .volumeBindingMode | default "WaitForFirstConsumer" }}
{{- if eq .allowVolumeExpansion false }}
allowVolumeExpansion: false
{{- else }}
allowVolumeExpansion: true
{{- end }}

parameters:
  csi.storage.k8s.io/fstype: ext4
{{- if .parameters }}
{{- toYaml .parameters | nindent 2 }}
{{- end }}

{{- end }}
{{- end }}
