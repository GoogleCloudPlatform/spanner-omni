{{- if not .Values.deployment.singleServer }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spanner-omni.fullname" $ }}-rollout
  namespace: {{ include "spanner-omni.namespace" $ }}
  labels:
    {{- include "spanner-omni.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "spanner-omni.fullname" $ }}-rollout
  namespace: {{ include "spanner-omni.namespace" $ }}
  labels:
    {{- include "spanner-omni.labels" $ | nindent 4 }}
rules:
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "patch", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "spanner-omni.fullname" $ }}-rollout
  namespace: {{ include "spanner-omni.namespace" $ }}
  labels:
    {{- include "spanner-omni.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "spanner-omni.fullname" $ }}-rollout
subjects:
- kind: ServiceAccount
  name: {{ include "spanner-omni.fullname" $ }}-rollout
  namespace: {{ include "spanner-omni.namespace" $ }}
{{- end }}
