createStorageClasses: true

storageClasses:
  - name: aws-gp3
    provisioner: ebs.csi.aws.com
    parameters:
      type: gp3
  - name: aws-standard
    provisioner: ebs.csi.aws.com
    parameters:
      type: standard

locations:
  - name: us-east-1
    zones:
      - name: us-east-1a
        shortName: a
      - name: us-east-1c
        shortName: b
      - name: us-east-1d
        shortName: c

dataStorageClass: aws-gp3
logsStorageClass: aws-standard
serviceAnnotations:
  service.beta.kubernetes.io/aws-load-balancer-internal: "true"
  service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
  service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

extraVolumes:
  - name: vmclock
    hostPath:
      path: /dev/vmclock0
      type: CharDevice

extraVolumeMounts:
  - name: vmclock
    mountPath: /dev/vmclock0
    readOnly: true

forcePrivilegedContainer: true

extraInitContainers:
  - name: vmclock-chmod
    image: 'busybox:stable'
    command: ['chmod', '644', '/dev/vmclock0']
    securityContext:
      runAsUser: 0
      privileged: true
    volumeMounts:
      - name: vmclock
        mountPath: /dev/vmclock0
