# This configuration is for a regional GKE cluster in us-east1 with three zones
# as ``us-east1-b``, ``us-east1-c``, ``us-east1-d``. This will create spanner deployment
# with 3 root servers and 2 non root servers per zone into 3 zones.

storageClasses:
  - name: hyperdisk-balanced-rwo
    provisioner: pd.csi.storage.gke.io
    parameters:
      type: hyperdisk-balanced

locations:
  - name: us-east1
    zones:
      - name: us-east1-b
        shortName: a
      - name: us-east1-c
        shortName: b
      - name: us-east1-d
        shortName: c

dataStorageClass: premium-rwo
logsStorageClass: standard-rwo
serviceAnnotations:
  networking.gke.io/load-balancer-type: "Internal"
  networking.gke.io/internal-load-balancer-allow-global-access: "true"
