# Default namespace for the monitoring stack
namespace: "monitoring"
# Default storage class to use across all monitoring components.
defaultStorageClass: ""

nodeSelector: {}
tolerations: []
affinity: {}

prometheus:
  replicas: 1
  image: "prom/prometheus:v3.0.1@sha256:565ee86501224ebbb98fc10b332fa54440b100469924003359edf49cbce374bd"
  retentionSize: "" # Leave empty to default to 80% of prometheus.storage.size
  retentionTime: "2y"
  spannerServiceEndpoint: "" # Leave empty to auto-resolve to SpannerOmni service
  enableCadvisorScrapeJob: false
  enableKubeletScrapeJob: false
  enablePushgateway: false
  # Enables the Prometheus TSDB admin API (/api/v1/admin/tsdb/*), e.g. for
  # taking snapshots. Disabled by default.
  enableAdminApi: false
  pushgateway:
    image: "prom/pushgateway:v1.6.0"
    resources:
      cpu: "100m"
      memory: "128Mi"
  resources:
    cpu: "2"
    memory: "4Gi"
  storage:
    className: ""
    size: "150Gi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

grafana:
  replicas: 1
  image: "grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb"
  resources:
    cpu: "2"
    memory: "4Gi"
  storage:
    className: ""
    size: "10Gi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

jaeger:
  replicas: 1
  image: "jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f"
  ports:
    ui: 16686
    otlpGrpc: 4317
    otlpHttp: 4318
  resources:
    cpu: "2"
    memory: "4Gi"
    # Optional memory limit, e.g. "6Gi". Empty means no limit.
    memoryLimit: ""
  # Optional GOMEMLIMIT, e.g. "4800MiB". Set it to about 80% of
  # resources.memoryLimit so Go collects garbage before reaching the limit.
  goMemLimit: ""
  storage:
    className: ""
    size: "10Gi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # TLS for the OTLP gRPC receiver (port ports.otlpGrpc), which Spanner uses to
  # export traces. In secure mode (global.insecureMode=false), Spanner only
  # exports traces to a remote OTLP endpoint over TLS, verifying the server
  # certificate against `ca-otlp.crt` in the Spanner `tls-certs` Secret. Without
  # TLS here, traces from secure-mode deployments are dropped. When enabled,
  # `ca-otlp.crt` is required in every mode (without it, Spanner exports in
  # plaintext, which a TLS receiver rejects). Requires Spanner Omni 2026.r6 or later
  # (not 2026.r4-lts); earlier releases only export in plaintext. Spanner servers pick up a
  # newly added `ca-otlp.crt` only after a restart.
  tls:
    # Serve the OTLP gRPC receiver over TLS. Defaults to false.
    enabled: false
    # Name of a pre-created Secret in the monitoring namespace with keys
    # `tls.crt` and `tls.key` (e.g. `kubectl create secret tls`). The
    # certificate's SANs must include jaeger.<monitoring namespace>.svc.cluster.local.
    # Add the CA that signed it to the Spanner `tls-certs` Secret as `ca-otlp.crt`.
    secretName: "jaeger-tls"
    # How often Jaeger re-reads the certificate and key from the Secret, so that
    # rotated certificates are used without a restart. Defaults to "1h".
    reloadInterval: "1h"
service:
  type: ""
  annotations: {}
