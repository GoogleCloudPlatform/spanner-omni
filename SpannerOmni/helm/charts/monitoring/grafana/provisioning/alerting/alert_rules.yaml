              editorMode: code
              expr: |-
                histogram_quantile(0.90, sum by (le) (rate(spanner_api_request_latencies_bucket{job="spanner", method=~".*Commit|.*BatchWrite|.*ExecuteBatchDml"}[1m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-tx-lock-wait-time-high
        title: TransactionLockWaitTimeHigh
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Transaction lock wait time high"
          description: "Average transaction lock wait time exceeds 50ms due to key lock contention on span server."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                sum(rate(spanner_total_lock_wait_time{job="spanner"}[5m])) / sum(rate(spanner_api_request_count{job="spanner"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 50000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-spanhostfs-write-lat-high
        title: SpanHostFsWriteLatencyHigh
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "SpanHostFS write latency high"
          description: "SpanHostFS storage disk fsync P90 latency exceeds 40ms."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                histogram_quantile(0.90, sum by (le) (rate(filesystem_latency_bucket{job="spanner", operation="Flush"}[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 40000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-spanhostfs-read-lat-high
        title: SpanHostFsReadLatencyHigh
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "SpanHostFS read latency high"
          description: "SpanHostFS storage disk read P90 latency exceeds 20ms."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                histogram_quantile(0.90, sum by (le) (rate(filesystem_latency_bucket{job="spanner", operation=~"PRead|Read"}[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 20000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

  - orgId: 1
    name: "Spanner Omni Error Rate & SLA"
    folder: "Spanner Omni"
    interval: 1m
    rules:
      - uid: spanner-api-error-rate-high
        title: ApiErrorRateHigh
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Spanner API error rate high"
          description: "User API error rate (all non-OK status codes) exceeds 5%."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (sum(rate(server_canonical_status_count{job="spanner", canonical_code!="OK", command=~".*ExecuteSql|.*ExecuteStreamingSql|.*Read|.*StreamingRead|.*Commit|.*BatchWrite|.*ExecuteBatchDml"}[1m])) or vector(0))
                /
                sum(rate(server_completed_rpcs{job="spanner", command=~".*ExecuteSql|.*ExecuteStreamingSql|.*Read|.*StreamingRead|.*Commit|.*BatchWrite|.*ExecuteBatchDml"}[1m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-transaction-abort-rate
        title: TransactionAbortRate
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Transaction abort rate high"
          description: "Transaction abort ratio exceeds 10% over 5 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                sum(rate(spanner_transaction_stat_total_commit_attempt_count{job="spanner", status="abort"}[5m]))
                /
                sum(rate(spanner_transaction_stat_total_commit_attempt_count{job="spanner"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-spanhostfs-error-rate-high
        title: SpanHostFsErrorRateHigh
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "SpanHostFS error rate high"
          description: "SpanHostFS storage disk file operation error rate exceeds 1%."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (sum(rate(filesystem_canonical_status_count{job="spanner", status!="OK"}[5m])) or vector(0))
                /
                sum(rate(filesystem_canonical_status_count{job="spanner"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.01
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

  - orgId: 1
    name: "Spanner Omni Resource Usage"
    folder: "Spanner Omni"
    interval: 1m
