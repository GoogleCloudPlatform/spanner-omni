apiVersion: 1

groups:
  - orgId: 1
    name: "Spanner Omni Availability"
    folder: "Spanner Omni"
    interval: 1m
    rules:
      - uid: spanner-pods-unhealthy
        title: SpannerPodsUnhealthy
        condition: B
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of Spanner pods unhealthy"
          description: "More than 5% of Spanner Omni nodes are failing health checks across the deployment."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                1 - avg(up{job="spanner"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-truetime-unavail-servers
        title: TrueTimeUnavailableAcrossServers
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "TrueTime unavailable across multiple servers"
          description: "TrueTime service is reporting unavailable on more than 1 server across the deployment."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                count(true_time_is_available{job="spanner"} == 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-clock-sla-violation
        title: ClockSlaViolation
        condition: B
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Clock SLA violation detected"
          description: "TSC clock SLA violation or non-zero violation rate observed on one or more VMs."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                sla_tester_is_violator{job="spanner"} > 0 or rate(sla_tester_violation_count{job="spanner"}[5m]) > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-unassigned-tablets
        title: UnassignedTablets
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Unassigned tablets in zone"
          description: "There are unassigned Spanner tablets in a zone for more than 10 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                sum by (spanner_zone) (spanner_zonemaster_unassigned_tablets_by_database_and_type{job="spanner"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-booting-tablets-high
        title: BootingTabletsHigh
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "High percentage of tablets in booting state"
          description: "More than 5% of Paxos tablets are in booting state in a zone for over 10 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (sum by (spanner_zone) (spanner_paxos_tablet_count{job="spanner", paxos_state="Booting"}) / sum by (spanner_zone) (spanner_paxos_tablet_count{job="spanner"}))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

  - orgId: 1
    name: "Spanner Omni Latency"
    folder: "Spanner Omni"
    interval: 1m
    rules:
      - uid: spanner-zone-paxos-repl-delay-high
        title: ZonePaxosReplicationDelayHigh
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Paxos replication delay high in zone"
          description: "P90 Paxos replication delay for a zone is >3x the median P90 across all zones (with >1s floor)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                histogram_quantile(0.90, sum by (le, spanner_zone) (rate(spanner_paxos_replication_delay_distribution_bucket{job="spanner"}[5m])))
                > on() group_left() (
                  3 * quantile(0.5,
                    histogram_quantile(0.90, sum by (le, spanner_zone) (rate(spanner_paxos_replication_delay_distribution_bucket{job="spanner"}[5m])))
                  )
                )
                and (
                  histogram_quantile(0.90, sum by (le, spanner_zone) (rate(spanner_paxos_replication_delay_distribution_bucket{job="spanner"}[5m]))) > 1.0
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-truetime-high-uncertainty
        title: TrueTimeHighUncertainityInterval
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "TrueTime high uncertainty interval"
          description: "TrueTime uncertainty interval P90 exceeds 1s (1,000,000 microseconds)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                histogram_quantile(0.90, sum by (le) (rate(true_time_interval_uncertainty_bucket{job="spanner"}[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1000000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-server-read-latency-high
        title: ServerReadLatencyHigh
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Spanner read API latency high"
          description: "Spanner read API request latency P90 exceeds 50ms for 5 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                histogram_quantile(0.90, sum by (le) (rate(spanner_api_request_latencies_bucket{job="spanner", method=~".*ExecuteSql|.*ExecuteStreamingSql|.*Read|.*StreamingRead"}[1m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-server-write-latency-high
        title: ServerWriteLatencyHigh
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Spanner write API latency high"
          description: "Spanner write API request latency P90 exceeds 100ms for 5 minutes."
        data:
          - refId: A
            relativeTimeRange:
