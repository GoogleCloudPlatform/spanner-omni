      - uid: spanner-non-cache-mem-warning
        title: NonCacheMemoryUtilizationHighWarning
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Non-cache memory utilization warning"
          description: "Non-cache memory usage exceeds 50% of total memory."
        data:
          - refId: A
            relativeTimeRange:
