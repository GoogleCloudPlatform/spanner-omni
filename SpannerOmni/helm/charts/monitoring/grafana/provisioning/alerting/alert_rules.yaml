                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold

      - uid: spanner-non-cache-mem-high
        title: NonCacheMemoryUtilizationHigh
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Non-cache memory utilization critical"
          description: "Non-cache memory usage exceeds 60% of total memory."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (sum(spanner_box_vm_memory_usage{job="spanner"}) - sum(spanner_server_memory_usage{job="spanner", category="cache"}))
                /
                sum(spanner_box_vm_memory_total{job="spanner"})
