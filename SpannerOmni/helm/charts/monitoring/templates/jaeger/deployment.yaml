{{- $platformValues := include "monitoring.PlatformValues" . | fromYaml }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jaeger
  namespace: {{ $.Values.namespace | default "monitoring" }}
  labels:
    app: jaeger
spec:
  replicas: {{ $.Values.jaeger.replicas | default 1 }}
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      automountServiceAccountToken: false
      {{- $nodeSelector := $.Values.jaeger.nodeSelector | default $.Values.nodeSelector }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $tolerations := $.Values.jaeger.tolerations | default $.Values.tolerations }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := $.Values.jaeger.affinity | default $.Values.affinity }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      containers:
        - name: jaeger
          image: {{ $.Values.jaeger.image | quote }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: "badger"
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_VALUE
              value: "/badger/data"
            - name: BADGER_DIRECTORY_KEY
              value: "/badger/key"
          ports:
            - containerPort: {{ $.Values.jaeger.ports.otlpGrpc }} # gRPC collection
            - containerPort: {{ $.Values.jaeger.ports.otlpHttp }} # HTTP collection
            - containerPort: {{ $.Values.jaeger.ports.ui }}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: {{ $.Values.jaeger.resources.cpu | quote }}
              memory: {{ $.Values.jaeger.resources.memory | quote }}
          volumeMounts:
            - name: jaeger-pvc
              mountPath: /badger
  volumeClaimTemplates:
    - metadata:
        name: jaeger-pvc
      spec:
        {{- $sc := $platformValues.jaeger.storage.className | default $platformValues.defaultStorageClass -}}
        {{- if $sc }}
        storageClassName: {{ $sc | quote }}
        {{- end }}
        volumeMode: Filesystem
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $.Values.jaeger.storage.size | quote }}
