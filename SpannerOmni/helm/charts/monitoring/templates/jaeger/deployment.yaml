{{- $platformValues := include "monitoring.PlatformValues" . | fromYaml }}
{{- $jaegerTls := eq (include "monitoring.jaegerTlsEnabled" .) "true" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jaeger
  namespace: {{ $.Values.namespace | default "monitoring" }}
  labels:
    app: jaeger
spec:
  replicas: {{ $.Values.jaeger.replicas | default 1 }}
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      automountServiceAccountToken: false
      {{- $nodeSelector := $.Values.jaeger.nodeSelector | default $.Values.nodeSelector }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $tolerations := $.Values.jaeger.tolerations | default $.Values.tolerations }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := $.Values.jaeger.affinity | default $.Values.affinity }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      containers:
        - name: jaeger
          image: {{ $.Values.jaeger.image | quote }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: "badger"
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_VALUE
              value: "/badger/data"
            - name: BADGER_DIRECTORY_KEY
              value: "/badger/key"
            {{- with $.Values.jaeger.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- if $jaegerTls }}
            # Serve the OTLP gRPC receiver over TLS. In secure mode, Spanner
            # only exports traces to a remote OTLP endpoint over TLS.
            - name: COLLECTOR_OTLP_GRPC_TLS_ENABLED
              value: "true"
            - name: COLLECTOR_OTLP_GRPC_TLS_CERT
              value: "/jaeger/tls/tls.crt"
            - name: COLLECTOR_OTLP_GRPC_TLS_KEY
              value: "/jaeger/tls/tls.key"
            # Re-read the certificate and key periodically, so that a rotated
            # Secret is picked up without restarting Jaeger.
            - name: COLLECTOR_OTLP_GRPC_TLS_RELOAD_INTERVAL
              value: {{ $.Values.jaeger.tls.reloadInterval | default "1h" | quote }}
            {{- end }}
          ports:
            - containerPort: {{ $.Values.jaeger.ports.otlpGrpc }} # gRPC collection
            - containerPort: {{ $.Values.jaeger.ports.otlpHttp }} # HTTP collection
            - containerPort: {{ $.Values.jaeger.ports.ui }}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: {{ $.Values.jaeger.resources.cpu | quote }}
              memory: {{ $.Values.jaeger.resources.memory | quote }}
            {{- with $.Values.jaeger.resources.memoryLimit }}
            limits:
              memory: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: jaeger-pvc
              mountPath: /badger
            {{- if $jaegerTls }}
            - name: jaeger-tls
              mountPath: /jaeger/tls
              readOnly: true
            {{- end }}
      {{- if $jaegerTls }}
      volumes:
        - name: jaeger-tls
          secret:
            secretName: {{ $.Values.jaeger.tls.secretName | default "jaeger-tls" | quote }}
            # Readable by the owner and group only. The files are group-owned by
            # the pod's fsGroup, which the container (running as 65534) gets as
            # a supplemental group.
            defaultMode: 0440
            # List the keys explicitly, so that a Secret without them fails to
            # mount with a clear event instead of Jaeger failing to start.
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: jaeger-pvc
      spec:
        {{- $sc := $platformValues.jaeger.storage.className | default $platformValues.defaultStorageClass -}}
        {{- if $sc }}
        storageClassName: {{ $sc | quote }}
        {{- end }}
        volumeMode: Filesystem
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $.Values.jaeger.storage.size | quote }}
