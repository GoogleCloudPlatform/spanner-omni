# Unfortunately, the Prometheus hostname is different between k8s and self-managed environments,
# so the Grafana datasource config can't be shared.
{{- $platformValues := include "monitoring.PlatformValues" . | fromYaml }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ $.Values.namespace | default "monitoring" }}
data:
  prometheus.yaml: |-
    {
        "apiVersion": 1,
        "datasources": [
            {
               "access":"proxy",
               "editable": true,
               "name": "prometheus",
               "uid": "prometheus",
               "orgId": 1,
               "type": "prometheus",
               "url": "http://prometheus-service.monitoring.svc:9090",
               "version": 1
            }
        ]
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: grafana
  name: grafana
  namespace: {{ $.Values.namespace | default "monitoring" }}
spec:
  replicas: {{ $.Values.grafana.replicas | default 1 }}
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      {{- $nodeSelector := $.Values.grafana.nodeSelector | default $.Values.nodeSelector }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $tolerations := $.Values.grafana.tolerations | default $.Values.tolerations }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := $.Values.grafana.affinity | default $.Values.affinity }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      containers:
        - name: grafana
          image: {{ $.Values.grafana.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /etc/grafana/admin_password/password
          ports:
            - containerPort: 3000
              name: http-grafana
              protocol: TCP
          resources:
            requests:
              cpu: {{ $.Values.grafana.resources.cpu | quote }}
              memory: {{ $.Values.grafana.resources.memory | quote }}
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-vol
            - mountPath: /etc/grafana
              name: grafana-ini
            - mountPath: /etc/grafana/provisioning/datasources
              name: grafana-datasources
            - mountPath: /etc/grafana/provisioning/alerting
              name: grafana-alert-rules
            - mountPath: /etc/grafana/provisioning/dashboards
              name: grafana-dashboard-provider
            {{- range $path, $bytes := $.Files.Glob "grafana/provisioning/dashboards/*.json" }}
            - mountPath: /etc/grafana/provisioning/dashboards/{{ trimSuffix ".json" (base $path) }}
              name: grafana-{{ trimSuffix ".json" (base $path) | replace "_" "-" }}-dashboard
            {{- end }}
            - mountPath: /etc/grafana/admin_password
              name: grafana-admin-password
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: grafana-ini
          configMap:
            name: grafana-ini
        - name: grafana-datasources
          configMap:
            defaultMode: 420
            name: grafana-datasources
        - name: grafana-alert-rules
          configMap:
            defaultMode: 420
            name: grafana-alert-rules
        - name: grafana-dashboard-provider
          configMap:
            defaultMode: 420
            name: grafana-dashboard-provider
        {{- range $path, $bytes := $.Files.Glob "grafana/provisioning/dashboards/*.json" }}
        - name: grafana-{{ trimSuffix ".json" (base $path) | replace "_" "-" }}-dashboard
          configMap:
            defaultMode: 420
            name: grafana-{{ trimSuffix ".json" (base $path) | replace "_" "-" }}-dashboard
        {{- end }}
        - name: grafana-admin-password
          secret:
            secretName: grafana-admin-password
  volumeClaimTemplates:
  - metadata:
      name: grafana-vol
    spec:
      {{- $sc := $platformValues.grafana.storage.className | default $platformValues.defaultStorageClass -}}
      {{- if $sc }}
      storageClassName: {{ $sc | quote }}
      {{- end }}
      volumeMode: Filesystem
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ $.Values.grafana.storage.size | quote }}
