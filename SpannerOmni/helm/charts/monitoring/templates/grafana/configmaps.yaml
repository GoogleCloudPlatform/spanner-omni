---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ini
  namespace: {{ $.Values.namespace | default "monitoring" }}
data:
  grafana.ini: |-
{{ $.Files.Get "grafana/grafana.ini" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules
  namespace: {{ $.Values.namespace | default "monitoring" }}
data:
  alert_rules.yaml: |-
{{ $.Files.Get "grafana/provisioning/alerting/alert_rules.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: {{ $.Values.namespace | default "monitoring" }}
data:
  dashboard_provider.yaml: |-
{{ $.Files.Get "grafana/provisioning/dashboards/dashboard_provider.yaml" | indent 4 }}
{{- range $path, $bytes := $.Files.Glob "grafana/provisioning/dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-{{ trimSuffix ".json" (base $path) | replace "_" "-" }}-dashboard
  namespace: {{ $.Values.namespace | default "monitoring" }}
data:
  {{ base $path }}: |-
{{ $bytes | toString | indent 4 }}
{{- end }}
