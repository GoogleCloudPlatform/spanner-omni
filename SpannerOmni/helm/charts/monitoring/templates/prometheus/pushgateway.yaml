{{- if $.Values.prometheus.enablePushgateway }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-pushgateway
  namespace: {{ $.Values.namespace | default "monitoring" }}
  labels:
    app: prometheus-pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-pushgateway
  template:
    metadata:
      labels:
        app: prometheus-pushgateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      {{- $nodeSelector := dig "nodeSelector" nil $.Values.prometheus.pushgateway | default $.Values.prometheus.nodeSelector | default $.Values.nodeSelector }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $tolerations := dig "tolerations" nil $.Values.prometheus.pushgateway | default $.Values.prometheus.tolerations | default $.Values.tolerations }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := dig "affinity" nil $.Values.prometheus.pushgateway | default $.Values.prometheus.affinity | default $.Values.affinity }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: pushgateway
        image: {{ $.Values.prometheus.pushgateway.image | quote }}
        ports:
        - containerPort: 9091
          name: http
        resources:
          requests:
            cpu: {{ $.Values.prometheus.pushgateway.resources.cpu | quote }}
            memory: {{ $.Values.prometheus.pushgateway.resources.memory | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-pushgateway
  namespace: {{ $.Values.namespace | default "monitoring" }}
  labels:
    app: prometheus-pushgateway
spec:
  type: ClusterIP
  ports:
  - port: 9091
    targetPort: 9091
    protocol: TCP
    name: http
  selector:
    app: prometheus-pushgateway
{{- end }}
