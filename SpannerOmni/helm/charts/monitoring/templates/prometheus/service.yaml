{{- $platformValues := include "monitoring.PlatformValues" . | fromYaml }}
apiVersion: v1
kind: Service
metadata:
    name: prometheus-service
    namespace: {{ $.Values.namespace | default "monitoring" }}
    annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port:   '9090'
        {{- if $platformValues.service.annotations }}
        {{- toYaml $platformValues.service.annotations | nindent 8 }}
        {{- end }}
spec:
    selector:
        app: prometheus-server
    {{- $serviceType := $.Values.service.type }}
    {{- if not $serviceType }}
      {{- if eq (int $.Values.prometheus.replicas) 1 }}
        {{- $serviceType = "NodePort" }}
      {{- else }}
        {{- $serviceType = "LoadBalancer" }}
      {{- end }}
    {{- end }}
    type: {{ $serviceType }}
    ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30009
