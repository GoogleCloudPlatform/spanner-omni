suite: Grafana Dashboards and Alert Rules Filter Tests
templates:
  - templates/grafana/configmaps.yaml

tests:
  - it: should include job=spanner filter in backups-and-restores dashboard queries
    set:
      global:
        insecureMode: false
    documentSelector:
      path: metadata.name
      value: grafana-backups-and-restores-dashboard
    asserts:
      - matchRegex:
          path: data["backups_and_restores.json"]
          pattern: '"expr":\s*"[^"]*job=\\"spanner\\"'
      - notMatchRegex:
          path: data["backups_and_restores.json"]
          pattern: '"name":\s*"job_filter"'
