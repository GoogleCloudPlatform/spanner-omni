suite: Jaeger Memory Tests
templates:
  - templates/jaeger/deployment.yaml

tests:
  - it: should not set a memory limit or GOMEMLIMIT by default
    set:
      global:
        insecureMode: true
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].resources.limits
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
          any: true

  - it: should set the memory limit and GOMEMLIMIT when configured
    set:
      global:
        insecureMode: true
      jaeger:
        resources:
          memoryLimit: 6Gi
        goMemLimit: 4800MiB
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 6Gi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 4Gi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 4800MiB
