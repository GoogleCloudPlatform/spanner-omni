suite: Insecure Mode Tests for Monitoring
templates:
  - templates/prometheus/config.yaml

tests:
  - it: should use https when global.insecureMode is false
    set:
      global:
        insecureMode: false
    asserts:
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "scheme: https"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: 'url: "https://spanner\..*\.svc\.cluster\.local:15012/metrics/targets"'
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: 'url: "https://spanner\..*\.svc\.cluster\.local:15012/metrics/targets/workers"'
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "honor_labels: true"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "regex: 'localhost:\\(\\.\\*\\)'"

  - it: should use http when global.insecureMode is true
    set:
      global:
        insecureMode: true
    asserts:
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "scheme: http"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: 'url: "http://spanner\..*\.svc\.cluster\.local:15012/metrics/targets"'
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: 'url: "http://spanner\..*\.svc\.cluster\.local:15012/metrics/targets/workers"'
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "honor_labels: true"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "regex: 'localhost:\\(\\.\\*\\)'"
