suite: Jaeger OTLP TLS Tests
templates:
  - templates/jaeger/deployment.yaml

tests:
  - it: should not configure TLS by default
    set:
      global:
        insecureMode: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: COLLECTOR_OTLP_GRPC_TLS_ENABLED
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: COLLECTOR_OTLP_GRPC_TLS_CERT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: COLLECTOR_OTLP_GRPC_TLS_KEY
          any: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: jaeger-pvc
              mountPath: /badger
      - isNull:
          path: spec.template.spec.volumes

  - it: should serve OTLP gRPC over TLS from the default secret when enabled
    set:
      global:
        insecureMode: false
      jaeger:
        tls:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COLLECTOR_OTLP_GRPC_TLS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COLLECTOR_OTLP_GRPC_TLS_CERT
            value: /jaeger/tls/tls.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COLLECTOR_OTLP_GRPC_TLS_KEY
            value: /jaeger/tls/tls.key
      # Rotated certificates are picked up without a restart.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COLLECTOR_OTLP_GRPC_TLS_RELOAD_INTERVAL
            value: 1h
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: jaeger-tls
            mountPath: /jaeger/tls
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: jaeger-pvc
            mountPath: /badger
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: jaeger-tls
              secret:
                secretName: jaeger-tls
                defaultMode: 288
      # OTLP HTTP and UI ports are unchanged.
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 16686

  - it: should use a custom TLS secret name and reload interval
    set:
      # The chart's schema requires `global`.
      global:
        insecureMode: false
      jaeger:
        tls:
          enabled: true
          secretName: my-jaeger-cert
          reloadInterval: 10m
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: my-jaeger-cert
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COLLECTOR_OTLP_GRPC_TLS_RELOAD_INTERVAL
            value: 10m
