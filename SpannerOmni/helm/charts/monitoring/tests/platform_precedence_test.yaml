suite: Monitoring Platform Precedence Tests
templates:
  - templates/prometheus/deployment.yaml

tests:
  - it: should not set storage class when no platform is set
    set:
      global:
        insecureMode: true
    asserts:
      - isNull:
          path: spec.volumeClaimTemplates[0].spec.storageClassName

  - it: should use platform storage class when platform is set
    set:
      global:
        platform: gke
        insecureMode: true
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: premium-rwo

  - it: should use argument value when no platform is set
    set:
      defaultStorageClass: custom-storage
      global:
        insecureMode: true
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: custom-storage

  - it: should use argument value even when platform is set (precedence)
    set:
      global:
        platform: gke
        insecureMode: true
      defaultStorageClass: custom-storage
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: custom-storage
