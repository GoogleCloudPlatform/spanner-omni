# Sample Spanner deployment configuration corresponding to SpannerOmni/samples/helm/values-multi-cloud.yaml

name: spanner-omni
location:
  - name: us-east-1
  - name: us-central1
zone:
  - name: us-east-1c
    location: us-east-1
    single_server: false
    root_server:
      - host: spanner-a-rt-0.pod.spanner-ns-use1
      - host: spanner-a-rt-1.pod.spanner-ns-use1
      - host: spanner-a-rt-2.pod.spanner-ns-use1
  - name: us-central1-a
    location: us-central1
    single_server: false
    root_server:
      - host: spanner-a-rt-0.pod.spanner-ns-usc1
      - host: spanner-a-rt-1.pod.spanner-ns-usc1
      - host: spanner-a-rt-2.pod.spanner-ns-usc1
deployment_settings:
  security_settings:
    insecure_mode: true
