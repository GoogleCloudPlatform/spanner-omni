# Sample Spanner deployment configuration corresponding to SpannerOmni/samples/helm/values-multi-region.yaml

name: spanner-omni
location:
  - name: us-west1
  - name: us-west2
  - name: us-west3
zone:
  - name: us-west1-a
    location: us-west1
    single_server: false
    root_server:
      - host: spanner-a-rt-0.pod.spanner-ns-usw1
      - host: spanner-a-rt-1.pod.spanner-ns-usw1
      - host: spanner-a-rt-2.pod.spanner-ns-usw1
  - name: us-west1-b
    location: us-west1
    single_server: false
    root_server:
      - host: spanner-b-rt-0.pod.spanner-ns-usw1
      - host: spanner-b-rt-1.pod.spanner-ns-usw1
      - host: spanner-b-rt-2.pod.spanner-ns-usw1
  - name: us-west2-a
    location: us-west2
    single_server: false
    root_server:
      - host: spanner-a-rt-0.pod.spanner-ns-usw2
      - host: spanner-a-rt-1.pod.spanner-ns-usw2
      - host: spanner-a-rt-2.pod.spanner-ns-usw2
  - name: us-west2-b
    location: us-west2
    single_server: false
    root_server:
      - host: spanner-b-rt-0.pod.spanner-ns-usw2
      - host: spanner-b-rt-1.pod.spanner-ns-usw2
      - host: spanner-b-rt-2.pod.spanner-ns-usw2
  - name: us-west3-a
    location: us-west3
    single_server: false
    replica_type: WITNESS
    root_server:
      - host: spanner-a-rt-0.pod.spanner-ns-usw3
      - host: spanner-a-rt-1.pod.spanner-ns-usw3
      - host: spanner-a-rt-2.pod.spanner-ns-usw3
deployment_settings:
  security_settings:
    insecure_mode: true
